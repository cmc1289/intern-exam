<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能技术能力评估平台 · 管理后台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
    min-height: 100vh; color: #e2e8f0;
  }
  .hidden { display: none !important; }

  /* 登录 */
  #login-view { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-card {
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px; padding: 36px; width: 340px;
  }
  .login-card h1 { font-size: 20px; margin-bottom: 6px; }
  .login-card p { color: #94a3b8; font-size: 13px; margin-bottom: 22px; }
  input, select {
    width: 100%; padding: 10px 12px; margin-bottom: 14px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(15,23,42,0.7);
    color: #e2e8f0; font-size: 14px; outline: none;
  }
  input:focus { border-color: #818cf8; }
  button {
    cursor: pointer; border: none; border-radius: 8px; font-size: 14px;
    padding: 10px 16px;
  }
  .btn-primary { background: linear-gradient(135deg,#6366f1,#8b5cf6); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost { background: rgba(255,255,255,0.08); color: #cbd5e1; }
  .btn-ghost:hover { background: rgba(255,255,255,0.14); }
  .msg { color: #f87171; font-size: 13px; margin-top: 8px; min-height: 18px; }

  /* 主视图 */
  #app-view { max-width: 1080px; margin: 0 auto; padding: 24px 20px 60px; }
  .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .topbar h1 { font-size: 18px; font-weight: 600; }
  .topbar .sub { color: #94a3b8; font-size: 12px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 12px; margin-bottom: 22px; }
  .stat-card { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 16px; }
  .stat-card .num { font-size: 26px; font-weight: 700; color: #a5b4fc; }
  .stat-card .lbl { color: #94a3b8; font-size: 12px; margin-top: 4px; }

  .panel { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; padding: 20px; margin-bottom: 20px; }
  .panel h2 { font-size: 15px; margin-bottom: 14px; color: #e2e8f0; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; }
  .field { flex: 1 1 180px; }
  .field label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; }
  .check-row { display: flex; gap: 18px; align-items: center; margin: 8px 0 14px; font-size: 14px; }
  .check-row input { width: auto; margin: 0 6px 0 0; }
  .spec-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .spec-chip { padding: 6px 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.18); font-size: 13px; cursor: pointer; user-select: none; }
  .spec-chip.active { background: #6366f1; border-color: #6366f1; color: #fff; }
  .link-box { display: flex; gap: 8px; margin-top: 10px; }
  .link-box input { margin: 0; flex: 1; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid rgba(255,255,255,0.07); }
  th { color: #94a3b8; font-weight: 500; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 11px; }
  .badge.green { background: rgba(81,207,102,0.18); color: #51cf66; }
  .badge.orange { background: rgba(255,169,77,0.18); color: #ffa94d; }
  .badge.gray { background: rgba(148,163,184,0.2); color: #94a3b8; }
  .act-btn { background: none; border: 1px solid rgba(129,140,248,0.5); color: #a5b4fc; padding: 4px 10px; border-radius: 6px; font-size: 12px; margin-right: 6px; }
  .act-btn:hover { background: rgba(129,140,248,0.15); }
  .empty { color: #64748b; text-align: center; padding: 26px; font-size: 13px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e293b; border: 1px solid rgba(255,255,255,0.15); padding: 10px 18px; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div id="login-view">
  <div class="login-card">
    <h1>评估平台 · 管理后台</h1>
    <p>智能技术能力评估平台</p>
    <input id="login-user" placeholder="用户名" autocomplete="username">
    <input id="login-pass" placeholder="密码" type="password" autocomplete="current-password">
    <button class="btn-primary" style="width:100%;" onclick="doLogin()">登 录</button>
    <div class="msg" id="login-msg"></div>
  </div>
</div>

<div id="app-view" class="hidden">
  <div class="topbar">
    <div>
      <h1>智能技术能力评估平台 · 管理后台</h1>
      <div class="sub">创建考试 → 发布链接 → 候选人考试 → AI 评分 → 查看报告</div>
    </div>
    <button class="btn-ghost" onclick="doLogout()">退出登录</button>
  </div>

  <div class="stats">
    <div class="stat-card"><div class="num" id="st-exams">-</div><div class="lbl">创建考试</div></div>
    <div class="stat-card"><div class="num" id="st-candidates">-</div><div class="lbl">候选人（总记录）</div></div>
    <div class="stat-card"><div class="num" id="st-submitted">-</div><div class="lbl">已提交</div></div>
    <div class="stat-card"><div class="num" id="st-avg">-</div><div class="lbl">平均成绩</div></div>
  </div>

  <div class="panel" id="create-panel">
    <h2>创建考试</h2>
    <div class="row">
      <div class="field"><label>考试名称</label><input id="f-title" placeholder="如：AI Agent 实习生初筛"></div>
      <div class="field"><label>考试时长（分钟）</label><input id="f-duration" type="number" value="30" min="5" max="180"></div>
    </div>
    <div class="field"><label>专业方向（可多选 1~3 个）</label>
      <div class="spec-group" id="f-specs"></div>
    </div>
    <div class="check-row">
      <label style="display:flex;align-items:center;"><input type="checkbox" id="f-subj" checked> 启用主观题</label>
      <label style="display:flex;align-items:center;"><input type="checkbox" id="f-ai" checked> 启用 AI 评分</label>
    </div>
    <button class="btn-primary" onclick="createExam()">创建考试</button>
    <div class="link-box hidden" id="new-link-box">
      <div style="width:100%;margin-bottom:6px;font-size:13px;color:#a5b4fc;">邀请码：<b id="new-code"></b>　(候选人访问链接会自动带码)</div>
      <input id="new-link" readonly value="" style="margin:0;">
      <button class="btn-ghost" onclick="copyLink('new-link')">复制链接</button>
    </div>
  </div>

  <div class="panel">
    <h2>考试列表</h2>
    <div id="exam-table"></div>
  </div>

  <div class="panel hidden" id="cand-panel">
    <h2 id="cand-title">候选人</h2>
    <div id="cand-table"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/admin.js?v=2"></script>
</body>
</html>
