<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>入职考核系统</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>

<div class="container" id="app">

  <!-- ========== 开始页 ========== -->
  <div id="start-page">
    <div class="start-card">
      <h1>Agent 实习生 · 入职考核</h1>
      <p class="subtitle">检验计算机基础、专业方向知识、安全常识与岗位情景应对能力</p>
      <div class="info-grid">
        <div class="info-item">
          <div class="label">题目数量</div>
          <div class="value">20 题</div>
        </div>
        <div class="info-item">
          <div class="label">考试时长</div>
          <div class="value" id="info-time">30 分钟</div>
        </div>
        <div class="info-item">
          <div class="label">及格分数线</div>
          <div class="value">60 分</div>
        </div>
      </div>
      <div class="exam-composition">
        <div class="comp-title">试卷构成：</div>
        <div class="comp-row">
          通用计算机基础 <span>4题</span>（必答，20%）<br>
          专业方向题目 <span>14题</span>（自选，含Agent，70%）<br>
          安全常识 <span>2题</span>（必答，10%）<br>
          <span style="font-size:11px;color:#889;">题型：单选 / 多选 / 判断 / 主观题 · 难度加权：简单×1.0 中等×1.5 困难×2.0</span>
        </div>
      </div>
      <button class="btn btn-primary" onclick="showSpecialtySelect()">下一步：选择题库方向</button>
      <button class="btn btn-outline" style="margin-left:10px;" onclick="showHistory()">历史记录</button>
    </div>
  </div>

  <!-- ========== 专业方向选择页 ========== -->
  <div id="specialty-page" class="hidden">
    <div class="start-card">
      <h1>选择你的专业方向</h1>
      <p class="subtitle">请选择你擅长的方向（可多选 1~3 个），系统会按比例从各方向抽取专业题目。</p>
      <div class="specialty-grid" id="specialty-grid"></div>
      <span class="skip-link" onclick="startExam('')">不选专业方向，全部使用通用基础题</span>
      <button class="btn btn-primary" id="btn-confirm" disabled onclick="confirmSpecialty()">确认并开始答题</button>
    </div>
  </div>

  <!-- ========== 答题页 ========== -->
  <div id="exam-page" class="hidden">
    <div class="exam-header">
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
        <span class="progress" id="q-progress"></span>
        <span class="specialty-tag" id="specialty-tag"></span>
      </div>
      <span class="timer" id="timer-display"></span>
    </div>
    <div class="question-card" id="q-card"></div>
    <div class="question-nav" id="question-nav"></div>
    <div class="nav-buttons">
      <button class="btn btn-outline" id="btn-prev" onclick="prevQuestion()" disabled>上一题</button>
      <button class="btn btn-primary" id="btn-next" onclick="nextOrSubmit()">下一题</button>
    </div>
  </div>

  <!-- ========== 结果页 ========== -->
  <div id="result-page" class="hidden">
    <div class="result-card" id="result-content"></div>
    <div class="back-btn-wrap">
      <button class="btn btn-outline" onclick="showHistory()">历史记录</button>
      <button class="btn btn-primary" onclick="restartExam()">重新开始</button>
    </div>
  </div>

  <!-- ========== 历史记录页 ========== -->
  <div id="history-page" class="hidden">
    <div class="start-card">
      <h1>历史记录</h1>
      <p class="subtitle">查看已开始和已提交的考试记录</p>
      <div class="history-list" id="history-list"></div>
      <button class="btn btn-outline" style="margin-top:22px;" onclick="backToStart()">返回首页</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
