services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # SQLite 数据库落盘到挂载卷，容器重启不丢数据
      - DB_PATH=/app/data/exam_records.sqlite3
    volumes:
      - ./data:/app/data
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # SSL 证书（宿主机 certbot 签发，容器只读挂载）
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # ACME 续期验证目录
      - ./certbot-www:/var/www/certbot:ro
    depends_on:
      - app
