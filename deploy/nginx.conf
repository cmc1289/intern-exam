# HTTP：ACME 证书续期验证 + 其余全部 301 跳转 HTTPS
server {
    listen 80;
    server_name tingyu0721.top www.tingyu0721.top;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl;
    server_name tingyu0721.top www.tingyu0721.top;

    ssl_certificate     /etc/letsencrypt/live/tingyu0721.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tingyu0721.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    client_max_body_size 10m;

    # HTML/JS 禁缓存，避免更新后浏览器用旧文件
    location ~ \.(html|js|css)$ {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
